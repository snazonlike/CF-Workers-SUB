;ruleset=全球直连,[]GEOIP,LAN
ruleset=全球直连,[]GEOIP,CN
ruleset=漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位

;应用类策略组，全部使用 .* 引入所有节点，并保留 DIRECT
custom_proxy_group=Telegram`select`.*[]DIRECT
custom_proxy_group=Ai平台`select`.*[]DIRECT
custom_proxy_group=YouTube`select`.*[]DIRECT
custom_proxy_group=Netflix`select`.*[]DIRECT
custom_proxy_group=巴哈姆特`select`.*[]DIRECT
custom_proxy_group=哔哩哔哩`select`[]全球直连`.*
custom_proxy_group=国外媒体`select`.*[]DIRECT
custom_proxy_group=国内媒体`select`[]DIRECT`.*
custom_proxy_group=Google`select`[]DIRECT`.*
custom_proxy_group=微软Bing`select`[]DIRECT`.*
custom_proxy_group=微软云盘`select`[]DIRECT`.*
custom_proxy_group=微软服务`select`[]DIRECT`.*
;custom_proxy_group=苹果服务`select`[]DIRECT`.*
; 已删除游戏平台相关策略组
custom_proxy_group=网易音乐`select`[]DIRECT`.*

;基础功能策略组
custom_proxy_group=全球直连`select`[]DIRECT`.*
custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=漏网之鱼`select`.*[]DIRECT

;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true

;clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml

;luck
